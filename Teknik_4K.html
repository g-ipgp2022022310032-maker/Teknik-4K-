return '<div class="pagehead"><div><span class="tag">Lihat Contoh</span><h2>Dari soalan kepada ayat lengkap.</h2><p>Lihat bagaimana setiap langkah membantu kita membentuk jawapan.</p></div><div class="switcher" role="group" aria-label="Pilih contoh"><button data-action="choose-example" data-index="0" aria-pressed="'+(state.example===0)+'">Contoh 1 · Bahan</button><button data-action="choose-example" data-index="1" aria-pressed="'+(state.example===1)+'">Contoh 2 · Tempat</button></div></div><div class="example-layout"><section class="panel reading"><div class="reading-title"><div><span class="tag">Petikan contoh</span><h3>Kek Pisang Hana</h3></div>'+cake+'</div><p class="passage">'+(k>=1?markedPassage(passageExample,e.evidence):esc(passageExample))+'</p><div class="context-note">'+icon('book',16)+' Baca petikan dan perhatikan maklumat yang berkaitan dengan soalan.</div></section><section class="panel k'+(k+1)+'">'+strip(k,'ex-step')+'<span class="label">Soalan</span><p class="question">'+question+'</p><div class="ex-explain">'+content+'</div></section></div>'+footerNav('example',k+1,4)}
function tokenText(text,kind){const w=state.work[state.q];return text.split(/\s+/).map((t,i)=>{let classes='',interactive=false;if(kind==='q'){if(w.qword===i)classes+=' selected-blue';if(w.keywords.includes(i))classes+=' selected-purple';interactive=state.k===0||state.k===1}else{if(w.evidence.includes(i))classes+=' selected-evidence';interactive=state.k===1}const pressed=kind==='q'?(state.k===0?w.qword===i:w.keywords.includes(i)):w.evidence.includes(i);return interactive?'<button class="token can-pick'+classes+'" data-action="token" data-kind="'+kind+'" data-index="'+i+'" aria-pressed="'+pressed+'" aria-label="'+esc(t)+' — '+(kind==='q'?(state.k===0?'kata tanya':'kata kunci'):'isi petikan')+'">'+esc(t)+'</button>':'<span class="token'+classes+'">'+esc(t)+'</span>'}).join(' ')}
function practiceView(){const w=state.work[state.q],q=questions[state.q],k=state.k;let task='';if(k===0)task='<div class="practice-tip">Tekan kata tanya dalam soalan di atas.</div><p class="note">Kata tanya membantu kamu mengetahui maklumat yang perlu dicari.</p>';if(k===1)task='<div class="practice-tip">Tekan perkataan penting dalam soalan. Kemudian, tekan isi yang berkaitan dalam petikan.</div><div class="legend"><span><i style="--col:#9875bd"></i>Kata kunci soalan</span><span><i style="--col:#8ba55b"></i>Isi dalam petikan</span></div><p class="note">Perkataan yang kamu pilih akan diserlahkan. Tekan sekali lagi untuk membuang tanda.</p><button class="btn small text" data-action="clear-marks">Padam Tanda K2</button>';if(k===2)task='<div class="practice-tip">Pilih kata hubung atau kata pemeri yang sesuai untuk ayat kamu.</div><div class="linkchoices">'+['ialah','adalah','kerana','supaya','dan','Tidak diperlukan'].map(s=>'<button data-action="choose-link" data-value="'+esc(s)+'" aria-pressed="'+(w.link===s)+'">'+s+'</button>').join('')+'</div><p class="note">Fikirkan hubungan antara batang soalan dengan isi jawapan. Gunakan unsur bahasa apabila diperlukan.</p>';if(k===3)task='<label class="textarea-label" for="answer">Tulis ayat lengkap kamu</label><textarea id="answer" rows="5" placeholder="Mulakan dengan batang soalan, kemudian sambungkan isi jawapan…" spellcheck="false">'+esc(w.answer)+'</textarea><div id="save-status" class="save-status">'+icon('save',13)+' '+(storageOK?'Tulisan disimpan pada peranti ini.':'Tulisan dikekalkan sepanjang sesi ini.')+'</div><div class="answer-actions"><button class="btn" data-action="hint" aria-expanded="'+w.hint+'">'+icon('key',16)+' Petunjuk</button><button class="btn" data-action="review" '+(!w.answer.trim()?'disabled':'')+'>'+icon('check',17)+' Semak Ayat Saya</button><button class="btn soft" data-action="model" '+(!w.answer.trim()?'disabled':'')+' aria-expanded="'+w.model+'">'+icon('book',16)+' '+(w.model?'Tutup Contoh':'Lihat Contoh Jawapan')+'</button></div><p id="model-gate-note" class="micro muted" '+(w.answer.trim()?'hidden':'')+' style="margin:11px 0 0">Tulis jawapan kamu dahulu untuk membuka semakan dan contoh.</p>'+(w.hint?'<div class="hint"><span class="label">Permulaan ayat sahaja</span><p>'+q.stem+'…</p></div>':'')+(w.reviewed?'<div class="done-summary" style="margin-top:17px">'+icon('check',14)+' Semakan kendiri telah dibuat</div>':'')+(w.model&&w.answer.trim()?modelView(q):'');return '<div class="pagehead"><div><span class="tag">Jom Cuba · Satu petikan, dua soalan</span><h2>Sekarang, giliran kamu menulis.</h2><p>Gunakan 4K untuk membina ayat lengkap sendiri.</p></div><span class="pill">Soalan '+(state.q+1)+' / 2</span></div><div class="practice-layout"><section class="panel reading"><div class="reading-title"><div><span class="tag">Petikan latihan</span><h3>Sandwic Danish</h3></div>'+sandwich+'</div><p class="passage">'+tokenText(passagePractice,'p')+'</p><div class="context-note">'+(k===1?'Tekan perkataan dalam petikan untuk menyerlahkan isi.':'Rujuk petikan ini semasa membina jawapan kamu.')+'</div></section><section class="panel q-panel k'+(k+1)+'"><div class="question-tab" role="group" aria-label="Pilih soalan">'+questions.map((a,i)=>'<button data-action="question" data-index="'+i+'" aria-pressed="'+(state.q===i)+'">Soalan '+(i+1)+'<span class="status-dot '+(state.work[i].answer.trim()?'filled':'')+'" aria-label="'+(state.work[i].answer.trim()?'Jawapan telah ditulis':'Belum ditulis')+'"></span></button>').join('')+'</div>'+strip(k,'practice-step')+'<span class="label">Soalan '+(state.q+1)+'</span><p class="question">'+tokenText(q.question,'q')+'</p>'+task+(k!==3?'<div class="step-action"><button class="btn text" data-action="write-now">Terus ke ruang menulis '+icon('arrow',16)+'</button></div>':'')+'</section></div>'+footerNav('practice',k+1,4)}
function modelView(q){return '<section class="model"><h3>Contoh jawapan</h3><p class="note">Bandingkan dengan tulisan kamu. Perhatikan batang soalan sebelum isi jawapan.</p><div class="sentence"><span class="highlight hl-purple">'+q.stem+'</span> <span class="highlight hl-orange">'+q.link+'</span> <span class="highlight hl-green">'+q.answer+'</span></div><div class="legend"><span><i style="--col:#9875bd"></i>Batang soalan</span><span><i style="--col:#d69951"></i>Kata hubung / pemeri</span><span><i style="--col:#6ca78c"></i>Isi jawapan</span></div><button class="btn small" data-action="edit-answer">'+icon('pen',16)+' Baiki Jawapan</button></section>'}
function openReview(){const w=state.work[state.q];if(!w.answer.trim()){toast('Tulis ayat kamu dahulu.');return}$('#own-answer').textContent=w.answer;$('#checklist').innerHTML=checkLabels.map((s,i)=>'<label><input type="checkbox" data-check="'+i+'" '+(w.checks[i]?'checked':'')+'><span>'+s+'</span></label>').join('');$('#review-dialog').showModal()}
function focusAnswer(){state.k=3;render();const a=$('#answer');if(a){a.focus();a.setSelectionRange(a.value.length,a.value.length)}}
function go(view){state.view=view;render(true)}
function next(){if(state.view==='home'){go('learn');return}if(state.view==='learn'){if(state.lesson<3)state.lesson++;else{state.view='example';state.exStep=0}render(true);return}if(state.view==='example'){const max=examples[state.example].link?2:1;if(state.exStep<3){state.exStep++;state.exStage=0}else if(state.exStage<max)state.exStage++;else if(state.example===0){state.example=1;state.exStep=0;state.exStage=0}else{go('practice');return}render();return}if(state.k<3){state.k++;render();if(state.k===3)$('#answer').focus()}else if(state.q===0){state.q=1;state.k=0;render(true)}else{const missing=state.work.findIndex(w=>!w.answer.trim());if(missing>=0){state.q=missing;state.k=3;render(true);$('#answer').focus();toast('Lengkapkan jawapan Soalan '+(missing+1)+' dahulu.')}else if(!state.work[1].reviewed){openReview()}else{toast('Kedua-dua jawapan telah ditulis. Kamu boleh menyemak dan membaikinya lagi.')}}}
function prev(){if(state.view==='learn'){if(state.lesson>0){state.lesson--;render(true)}else go('home')}else if(state.view==='example'){if(state.exStep===3&&state.exStage>0){state.exStage--;render()}else if(state.exStep>0){state.exStep--;render()}else if(state.example>0){state.example--;state.exStep=3;state.exStage=2;render()}else{state.lesson=3;go('learn')}}else if(state.view==='practice'){if(state.k>0){state.k--;render()}else if(state.q>0){state.q=0;state.k=3;render()}else go('example')}else go('home')}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;const i=Number(b.dataset.index);if(a==='home')go('home');else if(a==='learn')go('learn');else if(a==='example')go('example');else if(a==='practice')go('practice');else if(a==='lesson'){state.lesson=i;state.view='learn';render(true)}else if(a==='word'){state.word=i;render();document.querySelector('[data-action="word"][data-index="'+i+'"]').focus()}else if(a==='link-word'){state.linkWord=i;render();document.querySelector('[data-action="link-word"][data-index="'+i+'"]').focus()}else if(a==='demo'){state.demo=(state.demo+1)%3;render();document.querySelector('[data-action="demo"]').focus()}else if(a==='font'){state.large=!state.large;save();render()}else if(a==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Paparan penuh tidak disokong dalam pelayar ini.')}catch(err){toast('Buka fail dalam tab pelayar untuk menggunakan paparan penuh.')}}else if(a==='prev')prev();else if(a==='next')next();else if(a==='repeat'){if(state.view==='learn'){state.word=0;state.linkWord=0;state.demo=0}else if(state.view==='example'){state.exStep=0;state.exStage=0}else if(state.view==='practice'){state.k=0;toast('Langkah diulang. Tulisan kamu masih dikekalkan.')}render()}else if(a==='choose-example'){state.example=i;state.exStep=0;state.exStage=0;render()}else if(a==='ex-step'){state.exStep=i;state.exStage=0;render()}else if(a==='build'){state.exStage=Math.min(state.exStage+1,examples[state.example].link?2:1);render()}else if(a==='question'){state.q=i;render()}else if(a==='practice-step'){state.k=i;render();if(i===3)$('#answer').focus()}else if(a==='write-now')focusAnswer();else if(a==='token'){let w=state.work[state.q];if(b.dataset.kind==='q'&&state.k===0)w.qword=w.qword===i?null:i;else{let arr=b.dataset.kind==='q'?w.keywords:w.evidence;const pos=arr.indexOf(i);pos<0?arr.push(i):arr.splice(pos,1)}save();render();const el=document.querySelector('[data-action="token"][data-kind="'+b.dataset.kind+'"][data-index="'+i+'"]');if(el)el.focus({preventScroll:true})}else if(a==='clear-marks'){state.work[state.q].keywords=[];state.work[state.q].evidence=[];save();render()}else if(a==='choose-link'){const w=state.work[state.q];w.link=w.link===b.dataset.value?'':b.dataset.value;save();render();document.querySelector('[data-action="choose-link"][data-value="'+b.dataset.value+'"]').focus()}else if(a==='hint'){state.work[state.q].hint=!state.work[state.q].hint;save();render();document.querySelector('[data-action="hint"]').focus()}else if(a==='review')openReview();else if(a==='model'){const w=state.work[state.q];if(w.answer.trim()){w.model=!w.model;save();render();document.querySelector('[data-action="model"]').focus()}}else if(a==='edit-answer')focusAnswer();else if(a==='close-dialog')$('#review-dialog').close();else if(a==='edit-from-dialog'){$('#review-dialog').close();focusAnswer()}else if(a==='finish-review'){state.work[state.q].reviewed=state.work[state.q].checks.every(Boolean);save();$('#review-dialog').close();render();toast(state.work[state.q].reviewed?'Semakan kendiri selesai. Kamu boleh membaiki jawapan lagi.':'Semakan kamu dikekalkan. Baiki ayat dan semak perkara yang belum ditandakan.')}});
document.addEventListener('input',e=>{if(e.target.id==='answer'){const w=state.work[state.q];w.answer=e.target.value;w.reviewed=false;w.checks=[false,false,false,false,false];if(!w.answer.trim())w.model=false;save();const has=!!w.answer.trim();for(const a of ['review','model'])document.querySelector('[data-action="'+a+'"]').disabled=!has;$('#model-gate-note').hidden=has;$('#save-status').innerHTML=icon('save',13)+' '+(storageOK?'Tulisan disimpan pada peranti ini.':'Tulisan dikekalkan sepanjang sesi ini.');const dot=document.querySelectorAll('.question-tab .status-dot')[state.q];dot.classList.toggle('filled',has);dot.setAttribute('aria-label',has?'Jawapan telah ditulis':'Belum ditulis');const summary=document.querySelector('.done-summary');if(summary)summary.remove();if(!has){const model=document.querySelector('.model');if(model)model.remove();const mb=document.querySelector('[data-action="model"]');mb.innerHTML=icon('book',16)+' Lihat Contoh Jawapan';mb.setAttribute('aria-expanded','false')}}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){state.work[state.q].checks[Number(e.target.dataset.check)]=e.target.checked;save()}});
document.addEventListener('keydown',e=>{if($('#review-dialog').open||e.target.matches('textarea,input,button,[contenteditable]'))return;if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();prev()}});
document.addEventListener('fullscreenchange',()=>{const b=document.querySelector('[data-action="fullscreen"]');b.setAttribute('aria-label',document.fullscreenElement?'Keluar paparan penuh':'Paparan penuh');b.title=b.getAttribute('aria-label')});
render();
</script>
</body>
